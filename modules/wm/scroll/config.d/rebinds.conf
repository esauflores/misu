# Every keybind, ported from niri's rebinds.kdl + user.kdl. scroll uses the
# same column model, so the column actions map one to one (man 5 scroll).

# Apps.
# kitty is the terminal; herdr (agents, panes, workspaces) on Shift.
bindsym $mod+Return exec kitty
bindsym $mod+Shift+Return exec kitty -e herdr
bindsym $mod+Shift+e exec nautilus
bindsym $mod+Shift+b exec zen-browser
bindsym $mod+Shift+n exec code
bindsym $mod+space exec fuzzel
bindsym $mod+v exec cliphist list | fuzzel --dmenu --prompt 'clip  ' | cliphist decode | wl-copy
bindsym $mod+Shift+c exec hyprpicker -a
bindsym $mod+l exec misu-lock
bindsym $mod+k exec misu-keys
bindsym $mod+Ctrl+m exec kitty --class misu-seat -e misu-seat
bindsym $mod+n exec misu-nightlight

# Wallpaper (user.kdl swap: Super+W closes, Super+Q picks).
bindsym $mod+q exec misu-wall pick
bindsym $mod+Shift+w exec misu-wall random

# Screenshots: region to clipboard + file, whole output with Shift.
bindsym $mod+Shift+s exec misu-shot region
bindsym Print exec misu-shot region
bindsym Shift+Print exec misu-shot output

# Windows.
bindsym --no-repeat $mod+w kill
bindsym $mod+f fullscreen toggle
bindsym $mod+a floating toggle
bindsym $mod+Shift+a focus mode_toggle
# niri maximize-column / switch-preset-column-width / center-column.
bindsym $mod+d toggle_size this 1.0 1.0
bindsym $mod+r cycle_size h next
bindsym $mod+Shift+r cycle_size v next
bindsym $mod+c align center
bindsym $mod+Ctrl+r mode resize
bindsym $mod+Ctrl+Shift+r reload
# niri consume-or-expel: pull the window into / out of the neighbour column.
bindsym $mod+bracketleft move left nomode
bindsym $mod+bracketright move right nomode
bindsym $mod+Shift+Escape shortcuts_inhibitor toggle

# Focus and move columns (Up/Down: windows inside a column).
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+Home focus beginning
bindsym $mod+End focus end
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym Alt+Tab focus prev
bindsym $mod+Ctrl+Left cycle_size h prev
bindsym $mod+Ctrl+Right cycle_size h next
bindsym $mod+Ctrl+Up cycle_size v prev
bindsym $mod+Ctrl+Down cycle_size v next

# Workspaces. Super+N focus, Super+Alt+N move and follow, Super+Shift+N move and
# follow too (user.kdl override).
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Alt+1 move container to workspace number 1, workspace number 1
bindsym $mod+Alt+2 move container to workspace number 2, workspace number 2
bindsym $mod+Alt+3 move container to workspace number 3, workspace number 3
bindsym $mod+Alt+4 move container to workspace number 4, workspace number 4
bindsym $mod+Alt+5 move container to workspace number 5, workspace number 5
bindsym $mod+Alt+6 move container to workspace number 6, workspace number 6
bindsym $mod+Alt+7 move container to workspace number 7, workspace number 7
bindsym $mod+Alt+8 move container to workspace number 8, workspace number 8
bindsym $mod+Alt+9 move container to workspace number 9, workspace number 9
bindsym $mod+Alt+0 move container to workspace number 10, workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1, workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2, workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3, workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4, workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5, workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6, workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7, workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8, workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9, workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10, workspace number 10
bindsym $mod+Page_Up workspace prev_on_output
bindsym $mod+Page_Down workspace next_on_output
bindsym --whole-window $mod+button4 workspace prev_on_output
bindsym --whole-window $mod+button5 workspace next_on_output
bindsym $mod+Shift+Page_Up move container to workspace prev_on_output, workspace prev_on_output
bindsym $mod+Shift+Page_Down move container to workspace next_on_output, workspace next_on_output
# niri's overview: every workspace zoomed out; click or arrow to a window.
bindsym $mod+Tab scale_workspaces toggle
bindsym $mod+slash jump

# Monitors.
bindsym $mod+Alt+Left focus output left
bindsym $mod+Alt+Right focus output right
bindsym $mod+Alt+Up focus output up
bindsym $mod+Alt+Down focus output down
bindsym $mod+Alt+Shift+Left move container to output left
bindsym $mod+Alt+Shift+Right move container to output right
bindsym $mod+Ctrl+Alt+Left move workspace to output left
bindsym $mod+Ctrl+Alt+Right move workspace to output right

# Media and hardware keys (work on the lock screen too).
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+ && qs -c misu ipc call osd brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%- && qs -c misu ipc call osd brightness
bindsym --locked XF86TouchpadToggle input type:touchpad events toggle enabled disabled

mode resize {
    bindsym Left resize shrink width 20 px
    bindsym Right resize grow width 20 px
    bindsym Up resize shrink height 20 px
    bindsym Down resize grow height 20 px
    bindsym Return mode default
    bindsym Escape mode default
    bindsym $mod+r mode default
}
