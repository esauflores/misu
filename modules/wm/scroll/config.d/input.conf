# Keyboard, touchpad, cursors. `scrollmsg -t get_inputs` lists device identifiers.

input type:keyboard {
    xkb_layout us
    repeat_rate 25
    repeat_delay 600
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
    drag enabled
    click_method clickfinger
    dwt enabled
}

seat * xcursor_theme Bibata-Modern-Ice 20
focus_follows_mouse yes

# Multiple cursors: each seat has its own pointer, focus and keyboard target on
# the same screen. seat0 holds every device by default. Plug in a second mouse
# and run `misu-seat` (Super+Ctrl+M); it prints lines to paste here to keep it:
#
#   seat seat1 attach "1133:16511:Logitech_G502"
#   seat seat1 attach "1:1:AT_Translated_Set_2_keyboard"   # optional: seat1 can type too
#   seat seat1 xcursor_theme Bibata-Modern-Classic 20      # tell the cursors apart
