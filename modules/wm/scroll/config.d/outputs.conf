# Displays. Names from `scrollmsg -t get_outputs`. Add other screens here, e.g.
#   output HDMI-A-1 mode 2560x1440@144Hz position 1366 0 scale 1
output eDP-1 mode 1366x768@60.059Hz scale 1 position 0 0
output * adaptive_sync off

# Lid closed with an external screen: turn the panel off. Alone: logind suspends.
bindswitch --reload --locked lid:on output eDP-1 disable
bindswitch --reload --locked lid:off output eDP-1 enable
