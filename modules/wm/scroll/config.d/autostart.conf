# Run once at login. `exec` runs on start only; `exec_always` also re-runs on reload.

# Hand the session env to systemd and D-Bus, so portals and user services see WAYLAND_DISPLAY.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK SCROLLSOCK XDG_CURRENT_DESKTOP=scroll

# Wallpaper + matugen palette (restores the last one, black-hole.webp by default).
exec misu-wall restore

# The bar. Restarted on reload, so edits under modules/bar/ show up immediately.
exec_always sh -c 'qs kill -c misu >/dev/null 2>&1; exec qs -c misu'

# Agents.
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec wl-paste --watch cliphist store
exec misu-nightlight restore

# Idle: lock after 5 min, screen off after 10, lock before sleep.
exec swayidle -w \
    timeout 300 'misu-lock' \
    timeout 600 'scrollmsg "output * power off"' resume 'scrollmsg "output * power on"' \
    before-sleep 'misu-lock'
