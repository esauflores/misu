# Look and behavior. Values carried over from the niri settings
# (gaps 16, border 2, radius 8, shadow 45/0/5).

font pango:Noto Sans 10
default_border pixel 2
default_floating_border pixel 2
# Border and 16px gap on every window, even when it is alone (niri's focus ring).
hide_edge_borders none
gaps inner 16
gaps outer 0
smart_gaps off
titlebar_padding 6 3

# Fallback colors until misu-wall writes the wallpaper palette.
#                       border  bg      text    indicator child_border
client.focused          #c1c5dd #121318 #e3e1e9 #c1c5dd   #c1c5dd
client.focused_inactive #121318 #121318 #c6c6d0 #121318   #121318
client.unfocused        #121318 #121318 #8f909a #121318   #121318
client.urgent           #9b0000 #9b0000 #ffffff #9b0000   #9b0000

# Rounded corners and shadow (niri: radius 8, shadow softness 45, offset 0 5).
default_decoration border_radius 8 shadow true shadow_size 45 shadow_blur 45 shadow_offset 0 5 shadow_color #000000aa

# Columns scroll sideways like niri: new windows open as a full-width column
# to the right of the focused one; $mod+r cycles the preset widths.
layout_default_width 1.0
layout_default_height 1.0
layout_widths [0.33333 0.5 0.66667 1.0]
layout_heights [0.25 0.5 0.75 1.0]
cycle_size_wrap true

# niri-like motion: columns slide, windows fade in.
animations {
    enabled yes
    default yes 250 var 3 [ 0.215 0.61 0.355 1 ]
    window_open yes 250 var 3 [ 0 0 1 1 ]
    window_move yes 250 var 3 [ 0.215 0.61 0.355 1 ]
    window_size yes 250 var 3 [ 0.215 0.61 0.355 1 ]
    workspace_switch yes 300 var simple [ 0.215 0.61 0.355 1 ]
    window_fullscreen yes 300 var simple [ 0.3 0.5 0.4 1 ]
    layer_shell yes 250 var 3 [ 0 0 1 1 ]
    fade_in yes 250 var simple [ 0.32 0 0.67 0 ]
    fade_out yes 250 var simple [ 0.33 1 0.68 1 ]
}
focus_on_window_activation focus
mouse_warping container
floating_modifier $mod normal
floating_maximum_size 1920 x 1080

# Workspaces 1-5 are fixed in Misu's rail; scroll creates them on first visit.
# Not pinned to an output, so any screen (or the VM's) starts on workspace 1.

# Window rules (niri's window-rule blocks).
# Apps that ask to draw their own frame (VS Code, Zen, GTK4) get square corners
# from scroll; this tells tiled ones to use scroll's rounded border instead.
for_window [tiling] border pixel 2
for_window [app_id="org.gnome.Nautilus"] floating enable
for_window [app_id="(v|V)ncviewer"] floating enable
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable, resize set 720 520
for_window [app_id="blueman-manager"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="dialog"] floating enable
for_window [app_id="xdg-desktop-portal-gtk"] floating enable
# Zen's Bitwarden popup sets its title after mapping; scroll re-checks rules on
# title changes, so this replaces niri-float-bitwarden.py.
for_window [app_id="^zen" title="Bitwarden"] floating enable
for_window [shell="xwayland"] title_format "%title [X]"
