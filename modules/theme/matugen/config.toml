# misu-wall runs `matugen image <wallpaper>`; each template below is filled with
# the wallpaper's palette and written to ~/.local/state/rice/.

[config]

[templates.wm]
input_path = "~/.config/matugen/templates/wm-colors.json"
output_path = "~/.local/state/rice/wm-colors.json"

[templates.foot]
input_path = "~/.config/matugen/templates/foot-colors.ini"
output_path = "~/.local/state/rice/foot-colors.ini"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel-colors.ini"
output_path = "~/.local/state/rice/fuzzel-colors.ini"

[templates.misu]
input_path = "~/.config/matugen/templates/misu-colors.json"
output_path = "~/.local/state/rice/misu-colors.json"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.local/state/rice/btop.theme"

[templates.zed]
input_path = "~/.config/matugen/templates/zed-theme.json"
output_path = "~/.local/state/rice/zed-theme.json"
