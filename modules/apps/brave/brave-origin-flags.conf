# Brave Origin's launcher (/usr/bin/brave-origin) passes these on, one per line.
# Everything at 90%, like Zen's layout.css.devPixelsPerPx 0.9: the browser's
# own UI and every page (a page's zoom still starts at 100% on top of it).
# Below 1 it needs wm's wp_fractional_scale to fill its window on Wayland.
--force-device-scale-factor=0.9
