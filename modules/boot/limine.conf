# Misu's Limine globals. limine-update appends the generated kernel and snapshot
# entries below these lines.
# Boot the default entry after a second without drawing the menu; press any
# key during that second to get it. The default is plain Arch's kernel, by path
# (an index would count the OS folder as entry 1); after the first boot the last
# booted entry wins.
timeout: 1
quiet: yes
default_entry: Arch Linux/linux
remember_last_entry: yes
